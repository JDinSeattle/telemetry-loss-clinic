receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
exporters:
  otlp_http:
    endpoint: http://sink:8080
    encoding: json
    compression: none
    timeout: 300ms
    retry_on_failure:
      initial_interval: 100ms
      max_interval: 500ms
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 128
      batch:
        enabled: false
      storage: file_storage
extensions:
  file_storage:
    directory: /queue
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [file_storage, health_check]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [otlp_http]
