receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:35281
exporters:
  otlp_http:
    endpoint: http://127.0.0.1:37411
    encoding: json
    compression: none
    timeout: 200ms
    retry_on_failure:
      initial_interval: 100ms
      max_interval: 200ms
      max_elapsed_time: 20s
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 128
      batch:
        enabled: false
      storage: file_storage
extensions:
  file_storage:
    directory: /home/postedism/Desktop/crosscutting-careers/B-telemetry-loss-clinic/.runs/collector-0.147/storage_limit/queue
service:
  extensions: [file_storage]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 33911
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [otlp_http]
