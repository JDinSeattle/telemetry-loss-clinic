receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:54119
exporters:
  otlp_http:
    endpoint: http://127.0.0.1:45509
    encoding: json
    compression: none
    timeout: 200ms
    retry_on_failure:
      initial_interval: 100ms
      max_interval: 200ms
      max_elapsed_time: 20s
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 128
      batch:
        enabled: false
service:
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 41767
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [otlp_http]
